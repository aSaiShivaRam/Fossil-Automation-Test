# Every key can be overridden from the command line, e.g. -Dbrowser=firefox -Dheadless=true

# --- Browser ---------------------------------------------------------------
# chrome | firefox | edge
browser=chrome
headless=false
base.url=https://www.fossil.in/

# --- Synchronisation (seconds / milliseconds) ------------------------------
wait.explicit.seconds=20
wait.fluent.timeout.seconds=20
wait.fluent.polling.millis=500
page.load.timeout.seconds=60

# --- Test data -------------------------------------------------------------
search.term=Scarlette
product.code=ES5388
product.name=Scarlette Three-Hand Date Two-Tone Stainless Steel Watch
product.expected.price=11995.00

# --- Login -----------------------------------------------------------------
# fossil.in uses mobile number + OTP. When enabled, the script enters the number
# and then waits for you to type the OTP into the browser window.
login.enabled=false
login.phone=
login.otp.timeout.seconds=120
